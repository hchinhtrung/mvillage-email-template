<!DOCTYPE html>
<html>

<head>
    <title></title>
    <!-- The style tag will be stripped by Gmail but can be useful for webmail clients -->
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');

        body,
        table,
        td,
        p,
        a,
        li {
            font-family: 'Be Vietnam Pro', Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Be Vietnam Pro', Arial, Helvetica, sans-serif; line-height: 1.5; color: #374151; background-color: #F9FAFB;">
    <table border="0" cellpadding="0" cellspacing="0" style="background-color: #F9FAFB; padding: 16px;" width="100%">
        <tbody>
            <tr>
                <td align="center">
                    <table border="0" cellpadding="0" cellspacing="0"
                        style="background-color: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); max-width: 560px; width: 100%;">
                        <!-- Header with Logo -->
                        <tbody>
                            <tr>
                                <td align="center" style="padding: 0;"><a href="https://mvillage.vn/"
                                        target="_blank"><img alt="Your Company"
                                            src="https://cdn-v2.mvillage.vn/cms/More_new_logo_2_4_319dba3346.png"
                                            style="width: 100%; height: auto; max-width: none;" /> </a></td>
                            </tr>
                            <!-- Hero Section -->
                            <tr>
                                <td align="center"
                                    style="background-color: #FFF3EE; padding: 48px 32px; border-bottom: 1px solid #E5E7EB;">
                                    <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                        <tbody>
                                            <tr>
                                                <td align="center">
                                                    <div
                                                        style="width: 72px; height: 72px; margin: 0 auto 24px; display: inline-block; text-align: center; line-height: 72px;">
                                                        <img alt="Verification" height="56"
                                                            src="https://cdn-v2.mvillage.vn/cms/15c8wap8l4kimabwvmci_e24a3ed109.png"
                                                            style="vertical-align: middle;" width="56" />
                                                    </div>

                                                    <h1
                                                        style="font-size: 24px; font-weight: 700; color: #111827; margin-bottom: 12px; font-family: 'Be Vietnam Pro', Arial, sans-serif;">
                                                        {{.Title}}</h1>

                                                    <p
                                                        style="font-size: 16px; color: #4B5563; max-width: 380px; margin: 0 auto; font-family: 'Be Vietnam Pro', Arial, sans-serif;">
                                                        {{.Description}}</p>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            <!-- Main Content -->
                            <tr>
                                <td align="center" style="padding: 32px;">
                                    <p style="margin-bottom: 24px; font-family: 'Be Vietnam Pro', Arial, sans-serif;">
                                        {{.Guideline}}</p>
                                    <!-- Mobile-responsive button (full width on mobile) -->

                                    <table border="0" cellpadding="0" cellspacing="0" style="width: 100%;">
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <table border="0" cellpadding="0" cellspacing="0"
                                                        style="width: 100%;">
                                                        <tbody>
                                                            <tr>
                                                                <td align="center"
                                                                    style="border-radius: 8px; background-color: #F16A26;">
                                                                    <a href="{{.VerificationLink}}"
                                                                        style="display: block; background: #F16A26; color: #FFFFFF; font-weight: 600; font-size: 16px; font-family: 'Be Vietnam Pro', Arial, sans-serif; text-align: center; padding: 16px 32px; border-radius: 8px; text-decoration: none;">{{.Cta}}</a>
                                                                </td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <div
                                        style="margin-top: 24px; padding-top: 24px; border-top: 1px solid #E5E7EB; font-size: 14px; color: #4B5563; font-family: 'Be Vietnam Pro', Arial, sans-serif;">
                                        <p>{{.CopyBrowser}}</p>

                                        <div
                                            style="margin-top: 12px; padding: 12px; background: #F9FAFB; border-radius: 6px; font-size: 12px; word-break: break-all; color: #4B5563; border: 1px solid #E5E7EB; font-family: 'Be Vietnam Pro', Arial, sans-serif;">
                                            {{.VerificationLink}}</div>
                                    </div>
                                </td>
                            </tr>
                            <!-- Footer Banner -->
                            <tr>
                                <td style="padding: 0; text-align: center; background-color: #131313;">
                                    <img src="https://s3.ap-southeast-1.amazonaws.com/cdn-v2.mvillage.vn/cms/Email_Footer_Eng_940d68e7f8.jpg"
                                        alt="M Village Community" width="600"
                                        style="width: 100%; max-width: 600px; height: auto; display: block; border: 0; outline: none; text-decoration: none;">
                                </td>
                            </tr>
                            <!-- https://placehold.co/600x400?text=MVL+Brand+Portfolio -->

                            <!-- Footer -->
                            <tr>
                                <td style="padding: 0; background-color: #131313;">
                                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">

                                        <!-- Follow us -->
                                        <tr>
                                            <td style="padding: 30px 40px 24px 40px; text-align: center;">
                                                <p
                                                    style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #999; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-transform: uppercase; letter-spacing: 2px;">
                                                    Follow us</p>

                                                <!-- Social Icons -->
                                                <table role="presentation" cellspacing="0" cellpadding="0" border="0"
                                                    align="center">
                                                    <tr>
                                                        <!-- Facebook -->
                                                        <td style="padding: 0 10px;">
                                                            <a href="https://www.facebook.com/Mvillagecoliving"
                                                                rel="noopener" target="_blank"
                                                                style="display: inline-block; text-decoration: none;">
                                                                <img alt="Facebook"
                                                                    src="https://s3.ap-southeast-1.amazonaws.com/cdn-v2.mvillage.vn/cms/fb_5cae9adb2d.png"
                                                                    style="width: auto; height: 28px; vertical-align: middle; border: 0;" />
                                                            </a>
                                                        </td>
                                                        <!-- Instagram -->
                                                        <td style="padding: 0 10px;">
                                                            <a href="https://www.instagram.com/mvillage_hotel"
                                                                rel="noopener" target="_blank"
                                                                style="display: inline-block; text-decoration: none;">
                                                                <img alt="Instagram"
                                                                    src="https://s3.ap-southeast-1.amazonaws.com/cdn-v2.mvillage.vn/cms/ig_569a57f56b.png"
                                                                    style="width: auto; height: 28px; vertical-align: middle; border: 0;" />
                                                            </a>
                                                        </td>
                                                        <!-- TikTok -->
                                                        <td style="padding: 0 10px;">
                                                            <a href="https://www.tiktok.com/@mvillagehotel"
                                                                rel="noopener" target="_blank"
                                                                style="display: inline-block; text-decoration: none;">
                                                                <img alt="TikTok"
                                                                    src="https://s3.ap-southeast-1.amazonaws.com/cdn-v2.mvillage.vn/cms/tik_dc2ec16e1b.png"
                                                                    style="width: auto; height: 28px; vertical-align: middle; border: 0;" />
                                                            </a>
                                                        </td>
                                                        <!-- YouTube -->
                                                        <td style="padding: 0 10px;">
                                                            <a href="https://www.youtube.com/@mvillage_hotel"
                                                                rel="noopener" target="_blank"
                                                                style="display: inline-block; text-decoration: none;">
                                                                <img alt="YouTube"
                                                                    src="https://s3.ap-southeast-1.amazonaws.com/cdn-v2.mvillage.vn/cms/yt_d78ef1e89c.png"
                                                                    style="width: auto; height: 28px; vertical-align: middle; border: 0;" />
                                                            </a>
                                                        </td>
                                                        <!-- LinkedIn -->
                                                        <td style="padding: 0 10px;">
                                                            <a href="https://www.linkedin.com/company/mvillagevietnam"
                                                                rel="noopener" target="_blank"
                                                                style="display: inline-block; text-decoration: none;">
                                                                <img alt="LinkedIn"
                                                                    src="https://s3.ap-southeast-1.amazonaws.com/cdn-v2.mvillage.vn/cms/link_ba191d3c4c.png"
                                                                    style="width: auto; height: 28px; vertical-align: middle; border: 0;" />
                                                            </a>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <!-- Contact Info -->
                                        <tr>
                                            <td style="padding: 24px 40px; text-align: center;">
                                                <p
                                                    style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #999; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-transform: uppercase; letter-spacing: 2px;">
                                                    Contact us</p>
                                                <p
                                                    style="margin: 0 0 8px 0; font-size: 16px; line-height: 24px; color: #ccc; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                                                    Hotline: <a href="tel:19003311"
                                                        style="color: #fff; text-decoration: none; font-weight: 600;">1900
                                                        3311</a></p>
                                                <p
                                                    style="margin: 0; font-size: 16px; line-height: 24px; color: #ccc; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                                                    Email: <a href="mailto:booking@mvillage.vn"
                                                        style="color: #fff; text-decoration: none; font-weight: 600;">booking@mvillage.vn</a>
                                                </p>
                                            </td>
                                        </tr>

                                        <!-- Download our app -->
                                        <tr>
                                            <td style="padding: 24px 40px; text-align: center;">
                                                <p
                                                    style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #999; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-transform: uppercase; letter-spacing: 2px;">
                                                    Download our app</p>

                                                <!-- App Store Badges -->
                                                <table role="presentation" cellspacing="0" cellpadding="0" border="0"
                                                    align="center">
                                                    <tr>
                                                        <!-- App Store -->
                                                        <td style="padding: 0 6px;">
                                                            <a href="https://apps.apple.com/vn/app/m-village/id6458690802"
                                                                target="_blank"
                                                                style="display: inline-block; text-decoration: none;">
                                                                <img alt="Download on the App Store"
                                                                    src="https://s3.ap-southeast-1.amazonaws.com/cdn-v2.mvillage.vn/cms/ios_d92a4b0a64.png"
                                                                    style="height: 40px; border: 1px solid #555; border-radius: 6px;" />
                                                            </a>
                                                        </td>
                                                        <!-- Google Play -->
                                                        <td style="padding: 0 6px;">
                                                            <a href="https://play.google.com/store/apps/details?id=com.mvillage.app"
                                                                target="_blank"
                                                                style="display: inline-block; text-decoration: none;">
                                                                <img alt="Get it on Google Play"
                                                                    src="https://s3.ap-southeast-1.amazonaws.com/cdn-v2.mvillage.vn/cms/android_2b134665c6.png"
                                                                    style="height: 40px; border: 1px solid #555; border-radius: 6px;" />
                                                            </a>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <!-- Copyright -->
                                        <tr>
                                            <td style="padding: 16px 40px 30px 40px; text-align: center;">
                                                <p
                                                    style="margin: 0; font-size: 12px; line-height: 18px; color: #666; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0.5px;">
                                                    &copy; MVILLAGE JOINT STOCK COMPANY</p>
                                            </td>
                                        </tr>

                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
